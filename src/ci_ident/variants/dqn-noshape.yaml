# DQN-NoShape: strict masking, eta = 1, no shaping, no size term.
# Encoder: the paper's GNN-configuration table.  gamma and reward weights: the
# training configuration of the DQN-NoShape model (seed 3).
env:
  variant: noshape
  gamma: 0.99
  weights:
    w_perf: 10.0
    w_ext: 0.12088621917399761
    w_invalid: -0.2
    w_bad_stop: -1.0
    w_empty_stop: -1.0
model:
  algo: dqn
  conv: gin
  num_layers: 4
  hidden: 96
  pooling: mean
